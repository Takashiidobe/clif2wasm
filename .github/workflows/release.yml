name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag and published version
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "clif2wasm") | .version')"
          if [ "$GITHUB_REF_NAME" != "v$crate_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match clif2wasm Cargo.toml version $crate_version" >&2
            exit 1
          fi

          status="$(curl -A "clif2wasm-release-workflow" --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/clif2wasm/$tag_version")"
          if [ "$status" = "200" ]; then
            echo "clif2wasm $tag_version already exists on crates.io; skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected crates.io response while checking clif2wasm $tag_version: HTTP $status" >&2
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.version.outputs.publish == 'true'

      - name: Publish to crates.io
        if: steps.version.outputs.publish == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
