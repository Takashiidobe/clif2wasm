[package]
name = "clif2wasm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[dependencies]
cranelift-codegen = { version = "0.136.0", default-features = false, features = ["std", "pulley"] }
cranelift-frontend = "0.136.0"
cranelift-module = "0.136.0"
target-lexicon = "0.13"
waffle = { package = "portal-pc-waffle", version = "0.5.5" }
wasmparser = "0.261"

wasm-encoder = { version = "0.261", features = ["wasmparser"] }
thiserror = "2"
miette = "7"

[dev-dependencies]
cranelift-interpreter = "0.136.0"
cranelift-reader = "0.136.0"
getrandom = "0.4.3"
wasmi = { version = "2.0.0", features = ["simd"] }
