[package]
name = "clif2wasm"
version = "0.1.0"
edition = "2024"
description = "Translate Cranelift IR to WebAssembly"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/Takashiidobe/clif2wasm"
keywords = ["cranelift", "wasm", "webassembly"]
categories = ["wasm", "compilers"]
include = ["/src/**", "/README.md", "/LICENSE"]

[lib]
test = false
doctest = false

[dependencies]
cranelift-codegen = { version = "0.136.0", default-features = false, features = ["std", "x86"] }
cranelift-frontend = "0.136.0"
cranelift-module = "0.136.0"
target-lexicon = "0.13"
wasmparser = "0.261"
anyhow = "1.0"
fxhash = "0.2"
log = "0.4"
smallvec = "1.13"
wasm-encoder = { version = "0.248", default-features = false }
wasmparser_248 = { package = "wasmparser", version = "0.248", default-features = false, features = ["std", "validate", "simd"] }
rayon = { version = "1.10", optional = true }
addr2line = { version = "0.21", optional = true }
libfuzzer-sys = { version = "0.4.7", optional = true }
wasm-smith = { version = "0.248", optional = true }

thiserror = "2"
miette = "7"

[dev-dependencies]
cranelift-interpreter = "0.136.0"
cranelift-reader = "0.136.0"
getrandom = "0.4.3"
wasmi = { version = "2.0.0", features = ["simd"] }

[lints.clippy]
result_large_err = "allow"

[features]
default = []
parallel = ["dep:rayon"]
dwarf = ["dep:addr2line"]
fuzzing = ["dep:libfuzzer-sys", "dep:wasm-smith"]
